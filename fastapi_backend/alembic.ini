# Alembic configuration.
#
# The database URL is NOT stored here — alembic/env.py reads it from the same
# app settings (and .env) the service uses, so migrations can never run
# against a different database than the app.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revision files are named 0001_description.py so the order is obvious on disk.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
