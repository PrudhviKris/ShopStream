# Full stack: MySQL + storefront/API + Django admin.
#
#   cp .env.docker.example .env      # then edit the secrets
#   docker compose up --build
#
#   storefront + API  http://localhost:8000      (Swagger at /docs)
#   Django admin      http://localhost:8001/admin/
#
# The API container runs `alembic upgrade head` before serving, so the store
# schema is created and migrated on every deploy; the admin container runs
# `manage.py migrate` for Django's own auth/session tables.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Services wait for this: MySQL accepts connections a few seconds
      # before it can actually answer queries.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: fastapi_backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-ecommerce}
      # Alembic owns the schema in containers; never create tables on boot.
      AUTO_CREATE_SCHEMA: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-inr}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-database}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      TAX_RATE: ${TAX_RATE:-0.08}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media          # product images, shared with the admin
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: django_admin/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started   # the store tables come from the API's migrations
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-ecommerce}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8001}
      MEDIA_ROOT: /app/media
      STORE_BASE_URL: ${PUBLIC_URL:-http://localhost:8000}
      # Reached over the compose network, not the published port.
      STORE_API_URL: http://api:8000
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-}
    volumes:
      - media:/app/media
    ports:
      - "${ADMIN_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8001/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  db-data:
  media:
